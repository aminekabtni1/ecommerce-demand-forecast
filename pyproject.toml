[project]
name = "ecommerce-demand-forecast"
version = "0.1.0"
description = "Automated Data Pipeline + ML-Enhanced Dashboard for E-commerce Demand Forecasting"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.110.2",
    "uvicorn[standard]==0.29.0",
    "duckdb==0.10.2",
    "dbt-core==1.7.13",
    "dbt-duckdb==1.7.3",
    "requests==2.32.0",
    "pandas==2.2.2",
    "numpy==1.26.4",
    "statsmodels==0.14.2",
    "scikit-learn==1.4.2",
    "prefect==2.16.8",
    "python-dotenv==1.0.1",
    "pydantic==2.7.1",
    "httpx==0.27.0",
    "scipy==1.13.0",
    "griffe==0.38.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.1",
    "pytest-cov==5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.dbt]
profiles-dir = "warehouse"
project-dir = "warehouse"
